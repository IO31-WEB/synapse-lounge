<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Synapse Lounge Operator</title><style>body{font-family:Inter,system-ui;background:radial-gradient(circle at 20% 0,#112b52,transparent 34%),#030914;color:#eaf2ff;max-width:1100px;margin:0 auto;padding:64px 24px;min-height:100vh}h1{font-size:44px;letter-spacing:-.04em}input,button{padding:13px 15px;border-radius:10px;border:1px solid #1d4268;background:#071426;color:#eaf2ff}button{cursor:pointer;background:linear-gradient(110deg,#367bff,#703dff);font-weight:700}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin:28px 0}.card{background:linear-gradient(145deg,#091b31,#06101f);border:1px solid rgba(91,153,237,.18);border-radius:16px;padding:20px;box-shadow:0 18px 50px #0004}table{width:100%;border-collapse:collapse;background:#06111f;border:1px solid #17324f;border-radius:14px;overflow:hidden}td,th{text-align:left;padding:12px;border-bottom:1px solid #132b44}small{color:#8095b2}</style></head><body><h1>Synapse Lounge Operator</h1><p><small>Private revenue analytics. Enter the ADMIN_TOKEN configured on the Worker. The token is used only for this request and is not stored.</small></p><input id="t" type="password" placeholder="ADMIN_TOKEN"><button id="go">Load analytics</button><div id="out"></div><script>const e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));document.getElementById('go').onclick=async()=>{const o=document.getElementById('out');o.textContent='Loading...';try{const r=await fetch('/api/admin/analytics',{headers:{'X-Admin-Token':document.getElementById('t').value}}),d=await r.json();if(!r.ok)throw Error('Unauthorized or unavailable');const rows=Object.entries(d.by_tool||{}).sort((a,b)=>b[1].revenue_usd-a[1].revenue_usd);o.innerHTML=`<div class=cards><div class=card><small>PAID CALLS</small><h2>${d.paid_calls||0}</h2></div><div class=card><small>REVENUE</small><h2>$${Number(d.revenue_usd||0).toFixed(3)}</h2></div><div class=card><small>TOOLS EARNING</small><h2>${rows.length}</h2></div></div><table><tr><th>Tool</th><th>Calls</th><th>Revenue</th></tr>${rows.map(([k,v])=>`<tr><td>${e(k)}</td><td>${v.calls}</td><td>$${Number(v.revenue_usd).toFixed(3)}</td></tr>`).join('')}</table>`}catch(x){o.textContent=x.message}}</script></body></html>
