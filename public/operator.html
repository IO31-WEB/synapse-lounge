<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Synapse Lounge Operator</title><style>body{font-family:system-ui;background:#09090c;color:#eee;max-width:1000px;margin:40px auto;padding:20px}input,button{padding:12px;border-radius:8px;border:1px solid #333;background:#111;color:#eee}button{cursor:pointer}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin:20px 0}.card{background:#121218;border:1px solid #292934;border-radius:14px;padding:18px}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:10px;border-bottom:1px solid #222}small{color:#999}</style></head><body><h1>Synapse Lounge Operator</h1><p><small>Private revenue analytics. Enter the ADMIN_TOKEN configured on the Worker. The token is used only for this request and is not stored.</small></p><input id="t" type="password" placeholder="ADMIN_TOKEN"><button id="go">Load analytics</button><div id="out"></div><script>const e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));document.getElementById('go').onclick=async()=>{const o=document.getElementById('out');o.textContent='Loading...';try{const r=await fetch('/api/admin/analytics',{headers:{'X-Admin-Token':document.getElementById('t').value}}),d=await r.json();if(!r.ok)throw Error('Unauthorized or unavailable');const rows=Object.entries(d.by_tool||{}).sort((a,b)=>b[1].revenue_usd-a[1].revenue_usd);o.innerHTML=`<div class=cards><div class=card><small>PAID CALLS</small><h2>${d.paid_calls||0}</h2></div><div class=card><small>REVENUE</small><h2>$${Number(d.revenue_usd||0).toFixed(3)}</h2></div><div class=card><small>TOOLS EARNING</small><h2>${rows.length}</h2></div></div><table><tr><th>Tool</th><th>Calls</th><th>Revenue</th></tr>${rows.map(([k,v])=>`<tr><td>${e(k)}</td><td>${v.calls}</td><td>$${Number(v.revenue_usd).toFixed(3)}</td></tr>`).join('')}</table>`}catch(x){o.textContent=x.message}}</script></body></html>
