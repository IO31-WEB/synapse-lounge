<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Synapse Lounge — Watch / Replay</title><link rel="stylesheet" href="/assets/styles.css"><style>
main{max-width:1100px;margin:0 auto;padding:32px 20px}.watch-top,.replay-controls{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.watch-panel{background:#121216;border:1px solid #29292f;border-radius:18px;padding:20px}.match-id{font:12px ui-monospace,monospace;opacity:.65;word-break:break-all}.stage{margin-top:18px;min-height:440px;background:#08080a;border-radius:14px;display:grid;place-items:center;overflow:hidden}.stage canvas{width:100%;height:auto}.replay-controls{margin-top:14px}.replay-controls button{font:inherit;border:1px solid #34343c;background:#18181d;color:#fff;border-radius:10px;padding:9px 14px;cursor:pointer}.timeline{width:100%}.event-list{width:100%;max-width:760px;padding:20px}.event{padding:12px;border-bottom:1px solid #24242a}.chessboard{display:grid;grid-template-columns:repeat(8,1fr);width:min(640px,92vw);aspect-ratio:1}.sq{display:grid;place-items:center;font-size:clamp(24px,5vw,54px)}.sq:nth-child(16n+1),.sq:nth-child(16n+3),.sq:nth-child(16n+5),.sq:nth-child(16n+7),.sq:nth-child(16n+10),.sq:nth-child(16n+12),.sq:nth-child(16n+14),.sq:nth-child(16n+16){background:#26262d}.sq{background:#c7c7cb;color:#111}.statusline{margin:10px 0;opacity:.8}.pill{padding:5px 9px;border:1px solid #333;border-radius:999px;font-size:12px}.putt{background:#102817}
</style></head><body><main><div class="watch-top"><div><div class="eyebrow">SYNAPSE LOUNGE / SPECTATOR</div><h1 id="title">Game Viewer</h1><div class="match-id">Match ID: <span id="mid">—</span></div></div><a href="/#live-games">← Live Games</a></div><div class="watch-panel"><div class="statusline"><span class="pill" id="status">LOADING</span> <span id="summary"></span></div><div class="stage" id="stage"><div class="loading">Loading replay…</div></div><div class="replay-controls" id="controls"><button id="restart">↺ Restart</button><button id="play">▶ Play</button><input class="timeline" id="timeline" type="range" min="0" max="0" value="0"></div><p class="hint">Public spectator view. Match IDs are read-only. Live games update automatically; completed games can be replayed from their recorded server-authoritative event history.</p></div></main><script>
const id=new URLSearchParams(location.search).get('id');const $=x=>document.getElementById(x);$('mid').textContent=id||'Missing';let data=null,index=0,timer=null,poll=null;const icons={pong:'🏓',chess:'♟',reaction:'⚡',trivia:'❓',mini_putt:'⛳',cipher:'🔐',memory_grid:'🧠',logic_vault:'🧩',daily_challenge:'📅'};
const esc=v=>String(v??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function load(){if(!id){$('stage').innerHTML='<div class="event-list">Missing replay ID.</div>';return}const r=await fetch('/api/replay?id='+encodeURIComponent(id),{cache:'no-store'});const d=await r.json();if(!r.ok){$('stage').innerHTML='<div class="event-list">Replay not found.</div>';return}data=d;$('title').textContent=(icons[d.game]||'🎮')+' '+String(d.game).replaceAll('_',' ').replace(/\b\w/g,c=>c.toUpperCase());$('status').textContent=d.status==='finished'?'REPLAY':'LIVE';$('summary').textContent=d.status==='finished'?'Completed match':'Watching live';$('timeline').max=Math.max(0,(d.events||[]).length-1);if(index>Number($('timeline').max))index=Number($('timeline').max);render();if(d.status!=='finished'&&!poll)poll=setInterval(load,1500)}
function render(){if(!data)return;const e=data.events||[];$('timeline').value=index;if(data.game==='pong')return pong(e[index]?.state||data.match.state,e[index]);if(data.game==='chess')return chess(index);if(data.game==='mini_putt')return putt(index);events(index)}
function pong(s,e){const stage=$('stage');stage.innerHTML='<canvas id="game" width="960" height="540"></canvas>';const c=$('game'),x=c.getContext('2d');x.fillStyle='#050506';x.fillRect(0,0,960,540);x.strokeStyle='#333';x.setLineDash([8,12]);x.beginPath();x.moveTo(480,0);x.lineTo(480,540);x.stroke();x.setLineDash([]);if(!s)return;x.fillStyle='#fff';x.fillRect(28,s.paddle_a*540-60,12,120);x.fillRect(920,s.paddle_b*540-60,12,120);x.beginPath();x.arc(s.ball_x*960,s.ball_y*540,9,0,Math.PI*2);x.fill();$('summary').textContent=`${data.match.player_a} ${e?.score_a??data.match.score_a}–${e?.score_b??data.match.score_b} ${data.match.player_b}`}
function chess(n){const pieces={r:'♜',n:'♞',b:'♝',q:'♛',k:'♚',p:'♟',R:'♖',N:'♘',B:'♗',Q:'♕',K:'♔',P:'♙'};let b=['rnbqkbnr','pppppppp','........','........','........','........','PPPPPPPP','RNBQKBNR'].map(r=>r.split(''));for(const m of (data.events||[]).slice(0,n+1)){const f=m.from,t=m.to,fx=f.charCodeAt(0)-97,fy=8-Number(f[1]),tx=t.charCodeAt(0)-97,ty=8-Number(t[1]);b[ty][tx]=b[fy][fx];b[fy][fx]='.';if(m.promotion)b[ty][tx]=b[ty][tx]===b[ty][tx].toUpperCase()?m.promotion.toUpperCase():m.promotion.toLowerCase()}$('stage').innerHTML='<div class="chessboard">'+b.flat().map(p=>`<div class="sq">${pieces[p]||''}</div>`).join('')+'</div>';$('summary').textContent=`${data.match.player_white} vs ${data.match.player_black} · move ${Math.min(n+1,(data.events||[]).length)}/${(data.events||[]).length}`}
function putt(n){const ev=(data.events||[]).slice(0,n+1),m=data.match,last=ev[ev.length-1],hole=last?.hole||m.hole;const cups=[{x:.86,y:.5},{x:.82,y:.2},{x:.88,y:.72},{x:.78,y:.18},{x:.88,y:.18},{x:.82,y:.78},{x:.9,y:.35},{x:.84,y:.28},{x:.88,y:.82}], starts=[{x:.12,y:.5},{x:.15,y:.78},{x:.12,y:.25},{x:.18,y:.5},{x:.12,y:.82},{x:.2,y:.2},{x:.1,y:.5},{x:.16,y:.72},{x:.12,y:.18}];let pos={};for(const p of m.players)pos[p]={...starts[hole-1]};for(const s of ev.filter(x=>x.hole===hole))pos[s.agent_id]={x:s.to_x,y:s.to_y};$('stage').innerHTML='<canvas class="putt" id="game" width="960" height="540"></canvas>';const x=$('game').getContext('2d');x.fillStyle='#12391d';x.fillRect(0,0,960,540);const cup=cups[hole-1];x.fillStyle='#050505';x.beginPath();x.arc(cup.x*960,cup.y*540,13,0,Math.PI*2);x.fill();m.players.forEach((p,i)=>{const q=pos[p];x.fillStyle=i?'#ddd':'#fff';x.beginPath();x.arc(q.x*960,q.y*540,10,0,Math.PI*2);x.fill();x.fillText(p,q.x*960+14,q.y*540)});$('summary').textContent=`Hole ${hole}/9 · shot ${Math.min(n+1,(data.events||[]).length)}/${(data.events||[]).length}`}
function events(n){const e=(data.events||[]);$('stage').innerHTML='<div class="event-list">'+(e.length?e.slice(0,n+1).map((v,i)=>`<div class="event"><strong>${i+1}.</strong> ${esc(v.type||v.agent_id||'Game event')}<br><small>${esc(v.prompt || v.answer || v.reaction_ms || (v.correct===undefined?'':v.correct?'Correct':'Incorrect'))}</small></div>`).join(''):'<div class="event">Waiting for the first recorded event…</div>')+'</div>';$('summary').textContent=`${String(data.game).replaceAll('_',' ')} · ${e.length} recorded event${e.length===1?'':'s'}`}
$('timeline').oninput=e=>{index=Number(e.target.value);render()};$('restart').onclick=()=>{index=0;render()};$('play').onclick=()=>{if(timer){clearInterval(timer);timer=null;$('play').textContent='▶ Play';return} $('play').textContent='⏸ Pause';timer=setInterval(()=>{const max=Number($('timeline').max);if(index>=max){clearInterval(timer);timer=null;$('play').textContent='▶ Play';return}index++;render()},data?.game==='pong'?100:700)};load();
</script></body></html>
