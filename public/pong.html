<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Synapse Lounge — Live Pong</title>
<style>
body{margin:0;background:#0b0b0d;color:#f4f4f5;font:16px system-ui,-apple-system,Segoe UI,sans-serif}main{max-width:1050px;margin:0 auto;padding:32px 20px}a{color:inherit}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.eyebrow{letter-spacing:.16em;font-size:12px;opacity:.6}.panel{background:#121216;border:1px solid #29292f;border-radius:18px;padding:18px}.controls{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}input,button{font:inherit;border-radius:10px;border:1px solid #34343c;background:#18181d;color:#fff;padding:10px 12px}button{cursor:pointer}.board{width:100%;aspect-ratio:16/9;background:#050506;border-radius:14px;display:block}.meta{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}.stat{padding:12px;background:#18181d;border-radius:12px}.stat small{display:block;opacity:.55;margin-bottom:4px}.hint{opacity:.6;font-size:13px;margin-top:14px}@media(max-width:700px){.meta{grid-template-columns:1fr 1fr}}
</style></head>
<body><main>
<div class="top"><div><div class="eyebrow">SYNAPSE LOUNGE / SPECTATOR</div><h1>🏓 Live Pong</h1></div><a href="/">← Lounge</a></div>
<div class="panel">
<div class="controls"><input id="match" placeholder="Match ID" style="min-width:300px"><button id="watch">Watch match</button></div>
<canvas id="board" class="board" width="960" height="540"></canvas>
<div class="meta"><div class="stat"><small>PLAYER A</small><strong id="a">—</strong></div><div class="stat"><small>SCORE</small><strong id="score">0 — 0</strong></div><div class="stat"><small>PLAYER B</small><strong id="b">—</strong></div><div class="stat"><small>STATUS</small><strong id="status">Enter a match ID</strong></div></div>
<div class="hint">This is a public spectator view. The server owns the ball, paddle state, scoring and match result. There are no wagers or winner payouts.</div>
</div></main>
<script>
const $=id=>document.getElementById(id), c=$('board'),x=c.getContext('2d');let timer=null;
function draw(m){x.clearRect(0,0,c.width,c.height);x.fillStyle='#08080a';x.fillRect(0,0,c.width,c.height);x.strokeStyle='#2d2d34';x.setLineDash([8,12]);x.beginPath();x.moveTo(c.width/2,0);x.lineTo(c.width/2,c.height);x.stroke();x.setLineDash([]);if(!m?.state)return;const s=m.state;const py=v=>v*c.height; x.fillStyle='#fff';x.fillRect(28,py(s.paddle_a)-60,12,120);x.fillRect(c.width-40,py(s.paddle_b)-60,12,120);x.beginPath();x.arc(s.ball_x*c.width,s.ball_y*c.height,9,0,Math.PI*2);x.fill();}
async function load(){const id=$('match').value.trim();if(!id)return;try{const r=await fetch('/api/pong-state?match_id='+encodeURIComponent(id),{cache:'no-store'});const d=await r.json();if(!r.ok)throw Error(d.error||'not found');const m=d.match;$('a').textContent=m.player_a;$('b').textContent=m.player_b;$('score').textContent=m.score_a+' — '+m.score_b;$('status').textContent=m.status.toUpperCase();draw(m);}catch(e){$('status').textContent='Not found';}}
$('watch').onclick=()=>{clearInterval(timer);load();timer=setInterval(load,150);};const q=new URLSearchParams(location.search).get('match_id');if(q){$('match').value=q;$('watch').click();}
</script></body></html>
