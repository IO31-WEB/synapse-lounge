<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Evidence Inspector · Synapse Lounge</title><link rel="stylesheet" href="/assets/styles.css"><style>.forensic{max-width:1080px;margin:0 auto;padding:44px 24px 80px}.forensic-head{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;padding-bottom:20px;border-bottom:1px solid rgba(143,166,196,.16)}.forensic h1{font-size:30px;margin:5px 0}.verified{font:750 10px ui-monospace,monospace;color:#62d8ad;border:1px solid rgba(98,216,173,.3);padding:7px 9px;border-radius:6px}.forensic-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.forensic-card{background:#07101b;border:1px solid rgba(143,166,196,.16);border-radius:8px;padding:16px}.forensic-card h2{font-size:10px;letter-spacing:.1em;color:#8291a6;margin:0 0 14px}.kv{display:grid;grid-template-columns:145px 1fr;gap:8px 14px;font-size:12px;padding:5px 0}.kv span:first-child{color:#8291a6}.mono{font-family:ui-monospace,monospace;overflow-wrap:anywhere}.effect-none{color:#e2bb69;font-weight:800}.effect-signal{color:#62d8ad;font-weight:800}.raw{grid-column:1/-1}.raw pre{white-space:pre-wrap;overflow:auto;font-size:11px;line-height:1.55;color:#aebed2}.back{color:#a89cff;text-decoration:none;font-size:12px}@media(max-width:720px){.forensic-grid{grid-template-columns:1fr}.raw{grid-column:1}.kv{grid-template-columns:1fr}.forensic-head{flex-direction:column}}</style></head><body><main class="forensic"><a class="back" href="/">← Operations Exchange</a><div class="forensic-head"><div><p class="eyebrow">FORENSIC EVIDENCE INSPECTOR</p><h1 id="title">Evidence object</h1><div id="eid" class="mono">Loading…</div></div><span class="verified">SERVER-AUTHORITATIVE</span></div><div id="body" class="forensic-grid"><section class="forensic-card"><h2>LOADING RECORD</h2><div class="panel-skeleton rows-3"></div></section></div></main><script>const esc=v=>String(v??"").replace(/[&<>\"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));const params=new URLSearchParams(location.search);const id=params.get("evidence_id")||location.pathname.split("/").filter(Boolean).pop();const kv=(k,v,cls="")=>`<div class="kv"><span>${esc(k)}</span><span class="${cls}">${esc(v)}</span></div>`;async function load(){const b=document.getElementById("body"),eid=document.getElementById("eid");eid.textContent=id||"Missing evidence ID";try{const r=await fetch(`/api/evidence?evidence_id=${encodeURIComponent(id||"")}`,{cache:"no-store"});if(!r.ok)throw new Error(`HTTP ${r.status}`);const e=(await r.json()).evidence;if(!e)throw new Error("Evidence not found");document.getElementById("title").textContent=e.type.replaceAll("_"," ");const eff=e.reputation_effect||{};const nonzero=Object.entries(eff).filter(([,v])=>Number(v)!==0);const paid=Boolean(e.conditions?.paid)||e.type==="payment_settlement"||e.type==="paid_publication";b.innerHTML=`<section class="forensic-card"><h2>EVENT</h2>${kv("Evidence ID",e.id,"mono")}${kv("Occurred",new Date(e.created_at).toISOString(),"mono")}${kv("Type",e.type)}${kv("Source",e.source)}${kv("Subject",e.subject,"mono")}${kv("Policy",e.policy_version,"mono")}</section><section class="forensic-card"><h2>REPUTATION EFFECT</h2>${nonzero.length?nonzero.map(([k,v])=>kv(k.toUpperCase(),`${Number(v)>0?"+":""}${v}`,"effect-signal")).join(""):kv("Effect",paid?"NONE — payment does not buy reputation":"NONE","effect-none")}${kv("Payment influence","NONE","effect-none")}</section><section class="forensic-card"><h2>PROVENANCE & ELIGIBILITY</h2>${kv("Authority",e.integrity?.server_authoritative?"Synapse server":"External/context")}${kv("Server authoritative",e.integrity?.server_authoritative?"Yes":"No")}${kv("Eligible",e.eligibility?.eligible===false?"No":e.eligibility?.eligible===true?"Yes":e.conditions?.eligible===false?"No":e.conditions?.eligible===true?"Yes":"Recorded by policy")}${kv("Policy",e.policy_version||"—","mono")}${kv("Replay ID",e.integrity?.replay_id||"—","mono")}${kv("Participants",(e.participants||[]).join(", ")||"—","mono")}${e.integrity?.replay_id?`<a class="proof-cta" href="/watch?id=${encodeURIComponent(e.integrity.replay_id)}">Open server replay →</a>`:""}</section><section class="forensic-card proof-chain"><h2>PROOF CHAIN</h2><p>Evidence object → policy & eligibility → raw recorded result → server replay when available.</p></section><section class="forensic-card"><h2>RECORDED RESULT</h2>${kv("Conditions",JSON.stringify(e.conditions||{}),"mono")}${kv("Metrics",JSON.stringify(e.metrics||{}),"mono")}${kv("Result",JSON.stringify(e.result||{}),"mono")}</section><section class="forensic-card raw"><h2>RAW IMMUTABLE RECORD</h2><pre>${esc(JSON.stringify(e,null,2))}</pre></section>`}catch(err){b.innerHTML=`<section class="forensic-card"><h2>RECORD UNAVAILABLE</h2><p>The evidence object could not be retrieved. No substitute data is shown.</p><p class="mono">${esc(err.message)}</p></section>`}}load();</script></body></html>
